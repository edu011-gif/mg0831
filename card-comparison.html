<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 상품 비교</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            color: #666;
            font-size: 14px;
            font-weight: bold;
        }

        .filter-group select,
        .filter-group input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            font-weight: bold;
            color: #666;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filter-btn:hover {
            border-color: #667eea;
        }

        .reset-btn {
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            margin-left: auto;
        }

        .reset-btn:hover {
            background: #ee5a52;
        }

        .comparison-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .section-title {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card-item {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
        }

        .card-item:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(-5px);
            border-color: #667eea;
        }

        .card-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: relative;
        }

        .card-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-company {
            font-size: 13px;
            opacity: 0.9;
        }

        .wishlist-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wishlist-btn:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .wishlist-btn.added {
            background: #ff6b6b;
        }

        .card-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-benefit {
            background: #f0f4ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .card-benefit-title {
            font-size: 12px;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .card-benefit-text {
            font-size: 14px;
            color: #333;
            line-height: 1.4;
        }

        .card-features {
            margin-top: 15px;
            flex: 1;
        }

        .feature-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #555;
        }

        .feature-item::before {
            content: "✓";
            color: #4caf50;
            font-weight: bold;
            flex-shrink: 0;
        }

        .card-footer {
            padding: 15px 20px;
            border-top: 1px solid #e0e0e0;
            background: white;
        }

        .card-fee {
            font-size: 13px;
            color: #999;
            margin-bottom: 10px;
        }

        .fee-highlight {
            color: #667eea;
            font-weight: bold;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-small {
            padding: 10px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-small:hover {
            background: #667eea;
            color: white;
        }

        .btn-primary {
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.3s;
            grid-column: 1 / -1;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .comparison-table {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #f0f0f0;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            color: #333;
            border: 1px solid #ddd;
        }

        td {
            padding: 15px;
            border: 1px solid #ddd;
            color: #666;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .company-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .badge-samsung {
            background: #1428a0;
        }

        .badge-hyundai {
            background: #e6001b;
        }

        .badge-kb {
            background: #f69c00;
        }

        .badge-lotte {
            background: #c60c30;
        }

        .badge-shinhan {
            background: #00693b;
        }

        .badge-woori {
            background: #003d82;
        }

        .badge-hana {
            background: #005eb8;
        }

        .badge-nh {
            background: #097b3f;
        }

        .empty-message {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 18px;
        }

        .wishlist-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .wishlist-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wishlist-item-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .wishlist-item-company {
            font-size: 12px;
            color: #999;
        }

        .remove-wishlist-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .remove-wishlist-btn:hover {
            background: #ee5a52;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .modal-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section-title {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .modal-section-content {
            color: #666;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .btn-group {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>

        <div class="header">
            <h1>💳 카드 상품 비교</h1>
            
            <div class="filters">
                <div class="filter-group">
                    <label>카드사 선택</label>
                    <select id="companyFilter" onchange="applyFilters()">
                        <option value="">전체 카드사</option>
                        <option value="삼성카드">삼성카드</option>
                        <option value="현대카드">현대카드</option>
                        <option value="KB국민카드">KB국민카드</option>
                        <option value="롯데카드">롯데카드</option>
                        <option value="신한카드">신한카드</option>
                        <option value="우리카드">우리카드</option>
                        <option value="하나카드">하나카드</option>
                        <option value="NH농협카드">NH농협카드</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>카드 타입</label>
                    <select id="typeFilter" onchange="applyFilters()">
                        <option value="">전체 타입</option>
                        <option value="신용카드">신용카드</option>
                        <option value="체크카드">체크카드</option>
                        <option value="복합형">복합형</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>검색</label>
                    <input type="text" id="searchInput" placeholder="카드명 검색..." onkeyup="applyFilters()">
                </div>

                <div class="filter-group">
                    <label>혜택 필터</label>
                    <select id="benefitFilter" onchange="applyFilters()">
                        <option value="">모든 혜택</option>
                        <option value="캐시백">캐시백</option>
                        <option value="포인트">포인트</option>
                        <option value="마일리지">마일리지</option>
                        <option value="할인">할인</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="reset-btn" onclick="resetFilters()">필터 초기화</button>
                <div style="flex: 1; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="filter-btn active" onclick="toggleView('grid')">카드 보기</button>
                    <button class="filter-btn" onclick="toggleView('table')">표 보기</button>
                </div>
            </div>
        </div>

        <div id="gridView" class="comparison-section">
            <div class="section-title">
                🎯 카드 상품
                <span style="margin-left: auto; font-size: 16px; color: #999;" id="cardCount"></span>
            </div>
            <div class="cards-grid" id="cardsContainer"></div>
            <div class="empty-message" id="emptyGridMessage" style="display: none;">
                조건에 맞는 카드가 없습니다.
            </div>
        </div>

        <div id="tableView" style="display: none;" class="comparison-section">
            <div class="section-title">📊 카드 상세 비교</div>
            <div class="comparison-table">
                <table id="comparisonTable">
                    <thead>
                        <tr>
                            <th>카드명</th>
                            <th>카드사</th>
                            <th>타입</th>
                            <th>주요 혜택</th>
                            <th>연회비</th>
                            <th>작용</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="empty-message" id="emptyTableMessage" style="display: none;">
                조건에 맞는 카드가 없습니다.
            </div>
        </div>

        <div class="wishlist-section" id="wishlistSection" style="display: none;">
            <div class="section-title">
                ⭐ 내가 찜한 카드
                <span style="margin-left: auto; font-size: 16px; color: #999;" id="wishlistCount"></span>
            </div>
            <div class="wishlist-grid" id="wishlistContainer"></div>
        </div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

                id: 8,
                name: "NH농협 올바른 카드",
                company: "NH농협카드",
                type: "신용카드",
                mainBenefit: "할인",
                benefit: "농협 가맹점 3% 할인 + 캐시백",
                benefits: ["농협 가맹점 3% 할인", "하나로마트 5% 할인", "생활용품 부분별 특가", "지역 상권 우대 할인"],
                features: ["농촌 지역 할인 우대", "계절 상품 특가", "건강검진 우대", "보험료 할인"],
                annualFee: "무료",
                joinBenefit: "15,000포인트",
                usage: "제한 없음"
            }
        ];

        let filteredCards = [...cardData];
        let wishlist = [];

        // 초기 렌더링
        function init() {
            loadWishlist();
            renderCards();
            updateCounts();
        }

        // 필터 적용
        function applyFilters() {
            const company = document.getElementById('companyFilter').value;
            const type = document.getElementById('typeFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            const benefit = document.getElementById('benefitFilter').value;

            filteredCards = cardData.filter(card => {
                let matches = true;
                if (company && card.company !== company) matches = false;
                if (type && card.type !== type) matches = false;
                if (search && !card.name.toLowerCase().includes(search) && !card.company.toLowerCase().includes(search)) matches = false;
                if (benefit && !card.mainBenefit.includes(benefit)) matches = false;
                return matches;
            });

            renderCards();
            renderTable();
            updateCounts();
        }

        // 필터 초기화
        function resetFilters() {
            document.getElementById('companyFilter').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('benefitFilter').value = '';
            filteredCards = [...cardData];
            renderCards();
            renderTable();
            updateCounts();
        }

        // 카드 렌더링
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const emptyMessage = document.getElementById('emptyGridMessage');

            container.innerHTML = '';

            if (filteredCards.length === 0) {
                emptyMessage.style.display = 'block';
                return;
            }

            emptyMessage.style.display = 'none';

            filteredCards.forEach(card => {
                const cardEl = createCardElement(card);
                container.appendChild(cardEl);
            });
        }

        // 카드 엘리먼트 생성
        function createCardElement(card) {
            const div = document.createElement('div');
            div.className = 'card-item';
            
            const isWishlisted = wishlist.some(item => item.id === card.id);
            const badgeClass = `badge-${getCompanyShortName(card.company)}`;

            div.innerHTML = `
                <div class="card-header">
                    <div class="card-name">${card.name}</div>
                    <div class="card-company">${card.company}</div>
                    <button class="wishlist-btn ${isWishlisted ? 'added' : ''}" onclick="toggleWishlist(${card.id}, event)">
                        ${isWishlisted ? '❤️' : '🤍'}
                    </button>
                </div>
                <div class="card-content">
                    <div class="card-benefit">
                        <div class="card-benefit-title">🎁 주요 혜택</div>
                        <div class="card-benefit-text">${card.benefit}</div>
                    </div>
                    <div class="card-features">
                        ${card.features.slice(0, 3).map(feature => `
                            <div class="feature-item">${feature}</div>
                        `).join('')}
                    </div>
                </div>
                <div class="card-footer">
                    <div class="card-fee">연회비: <span class="fee-highlight">${card.annualFee}</span></div>
                    <div class="btn-group">
                        <button class="btn-small" onclick="openDetail(${card.id})">상세정보</button>
                        <button class="btn-primary" onclick="showApplyMessage('${card.name}')">신청하기</button>
                    </div>
                </div>
            `;

            return div;
        }

        // 테이블 렌더링
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const emptyMessage = document.getElementById('emptyTableMessage');

            tbody.innerHTML = '';

            if (filteredCards.length === 0) {
                emptyMessage.style.display = 'block';
                return;
            }

            emptyMessage.style.display = 'none';

            filteredCards.forEach(card => {
                const row = document.createElement('tr');
                const badgeClass = `badge-${getCompanyShortName(card.company)}`;

                row.innerHTML = `
                    <td><strong>${card.name}</strong></td>
                    <td><span class="company-badge ${badgeClass}">${card.company}</span></td>
                    <td>${card.type}</td>
                    <td>${card.benefit}</td>
                    <td>${card.annualFee}</td>
                    <td>
                        <button class="btn-small" onclick="openDetail(${card.id})" style="width: 100%; margin-bottom: 5px;">상세정보</button>
                        <button class="btn-small" onclick="showApplyMessage('${card.name}')" style="width: 100%; background: #667eea; color: white;">신청</button>
                    </td>
                `;

                tbody.appendChild(row);
            });
        }

        // 상세정보 모달 열기
        function openDetail(cardId) {
            const card = cardData.find(c => c.id === cardId);
            if (!card) return;

            const modalBody = document.getElementById('modalBody');
            const badgeClass = `badge-${getCompanyShortName(card.company)}`;

            modalBody.innerHTML = `
                <div class="modal-title">${card.name}</div>
                
                <div class="modal-section">
                    <div class="company-badge ${badgeClass}">${card.company}</div>
                </div>

                <div class="modal-section">
                    <div class="modal-section-title">📋 카드 정보</div>
                    <div class="modal-section-content">
                        <p><strong>카드 타입:</strong> ${card.type}</p>
                        <p><strong>연회비:</strong> ${card.annualFee}</p>
                        <p><strong>가입 혜택:</strong> ${card.joinBenefit}</p>
                        <p><strong>추천 사용액:</strong> ${card.usage}</p>
                    </div>
                </div>

                <div class="modal-section">
                    <div class="modal-section-title">🎁 주요 혜택</div>
                    <div class="modal-section-content">
                        <ul style="margin-left: 20px;">
                            ${card.benefits.map(benefit => `<li>${benefit}</li>`).join('')}
                        </ul>
                    </div>
                </div>

                <div class="modal-section">
                    <div class="modal-section-title">✨ 특징</div>
                    <div class="modal-section-content">
                        <ul style="margin-left: 20px;">
                            ${card.features.map(feature => `<li>${feature}</li>`).join('')}
                        </ul>
                    </div>
                </div>

                <button class="btn-primary" onclick="showApplyMessage('${card.name}'); closeModal();" style="margin-top: 20px;">
                    이 카드 신청하기
                </button>
            `;

            document.getElementById('detailModal').classList.add('active');
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // 찜 토글
        function toggleWishlist(cardId, event) {
            event.stopPropagation();
            const card = cardData.find(c => c.id === cardId);
            const index = wishlist.findIndex(item => item.id === cardId);

            if (index > -1) {
                wishlist.splice(index, 1);
            } else {
                wishlist.push(card);
            }

            saveWishlist();
            renderCards();
            renderWishlist();
            updateCounts();
        }

        // 찜 목록 렌더링
        function renderWishlist() {
            if (wishlist.length === 0) {
                document.getElementById('wishlistSection').style.display = 'none';
                return;
            }

            document.getElementById('wishlistSection').style.display = 'block';
            const container = document.getElementById('wishlistContainer');
            container.innerHTML = '';

            wishlist.forEach(card => {
                const div = document.createElement('div');
                div.className = 'wishlist-item';
                div.innerHTML = `
                    <div>
                        <div class="wishlist-item-name">${card.name}</div>
                        <div class="wishlist-item-company">${card.company}</div>
                    </div>
                    <button class="remove-wishlist-btn" onclick="toggleWishlist(${card.id}, event)">제거</button>
                `;
                container.appendChild(div);
            });

            document.getElementById('wishlistCount').textContent = `(${wishlist.length})`;
        }

        // 통계 업데이트
        function updateCounts() {
            document.getElementById('cardCount').textContent = `(${filteredCards.length}개)`;
            document.getElementById('wishlistCount').textContent = `(${wishlist.length}개)`;
        }

        // 찜 목록 저장/로드
        function saveWishlist() {
            localStorage.setItem('cardWishlist', JSON.stringify(wishlist));
        }

        function loadWishlist() {
            const saved = localStorage.getItem('cardWishlist');
            if (saved) {
                wishlist = JSON.parse(saved);
            }
            renderWishlist();
        }

        // 신청 메시지
        function showApplyMessage(cardName) {
            alert(`${cardName} 신청이 준비되었습니다!\n\n실제 신청은 카드사 공식 웹사이트에서 진행해주세요.`);
        }

        // 뷰 전환
        function toggleView(view) {
            const gridView = document.getElementById('gridView');
            const tableView = document.getElementById('tableView');
            const buttons = document.querySelectorAll('.filter-btn');

            buttons.forEach(btn => btn.classList.remove('active'));

            if (view === 'grid') {
                gridView.style.display = 'block';
                tableView.style.display = 'none';
                buttons[0].classList.add('active');
            } else {
                gridView.style.display = 'none';
                tableView.style.display = 'block';
                buttons[1].classList.add('active');
            }
        }

        // 카드사 약칭 (배지 색상용)
        function getCompanyShortName(company) {
            const map = {
                '삼성카드': 'samsung',
                '현대카드': 'hyundai',
                'KB국민카드': 'kb',
                '롯데카드': 'lotte',
                '신한카드': 'shinhan',
                '우리카드': 'woori',
                '하나카드': 'hana',
                'NH농협카드': 'nh'
            };
            return map[company] || 'samsung';
        }

        // 모달 외부 클릭으로 닫기
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // 페이지 로드
        window.addEventListener('load', init);
    </script>
</body>
</html>
